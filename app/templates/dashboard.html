<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ email }} — postorel.ru</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #0f1115;
            color: #e5e7eb;
            margin: 0;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.1rem;
            color: #9ca3af;
            font-weight: 400;
        }

        h2 {
            font-size: 1rem;
            margin-top: 2rem;
            color: #e5e7eb;
        }

        a.logout {
            color: #f87171;
            text-decoration: none;
            font-size: 0.85rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
        }

        th,
        td {
            text-align: left;
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #2d3138;
            font-size: 0.9rem;
        }

        th {
            color: #9ca3af;
            font-weight: 500;
        }

        code {
            background: #1a1d24;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .empty {
            color: #6b7280;
            font-size: 0.85rem;
            padding: 0.5rem 0;
        }

        .link-box {
            word-break: break-all;
            font-size: 0.8rem;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #c82333;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>{{ email }}</h1>
        <form method="post" action="/logout" style="margin:0;">
            <button type="submit" class="logout">Выйти</button>
        </form>
    </div>

    <h2>История кодов восстановления</h2>
    {% if recovery_codes %}
    <table>
        <tr>
            <th>Код</th>
            <th>Получено</th>
        </tr>
        {% for item in recovery_codes %}
        <tr>
            <td><code>{{ item.code }}</code></td>
            <td>{{ item.time_ago }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <div class="empty">Кодов восстановления не найдено</div>
    {% endif %}
</body>

</html>
