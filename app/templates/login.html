<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — postorel.ru</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #0f1115;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        form {
            background: #1a1d24;
            padding: 2rem;
            border-radius: 12px;
            width: 320px;
        }

        h1 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
            color: #9ca3af;
        }

        input {
            width: 100%;
            padding: 0.6rem;
            margin-bottom: 1rem;
            border-radius: 6px;
            border: 1px solid #2d3138;
            background: #0f1115;
            color: #e5e7eb;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 0.7rem;
            border-radius: 6px;
            border: none;
            background: #4f46e5;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .error {
            color: #f87171;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <form method="post" action="/login">
        <h1>Вход в почтовый сервис</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <label for="email">Email ящика</label>
        <input type="email" id="email" name="email" required autofocus>
        <label for="request_password">Пароль</label>
        <input type="password" id="request_password" name="request_password" required>
        <button type="submit">Войти</button>
    </form>
</body>

</html>
